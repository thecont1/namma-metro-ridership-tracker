name: Metro Ridership Data Collection

on:
  schedule:
    - cron: '33 7 * * *'  # 07:33 UTC / 13:03 IST
    - cron: '7 12 * * *'  # 12:07 UTC / 17:37 IST
    - cron: '22 17 * * *' # 17:22 UTC / 22:52 IST
  workflow_dispatch:  # Allows manual trigger for testing

jobs:
  collect-data:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Install uv
      run: pip install uv

    - name: Install dependencies
      run: uv sync --frozen --no-dev

    - name: Run ridership data collection
      run: |
        echo "Python version:"
        uv run python --version

        # Run with timeout and error handling
        echo "Starting ridership data collection..."
        timeout 300s uv run python -u ridership.py || {
          echo "Error: ridership.py failed or timed out after 5 minutes"
          exit 1
        }

    - name: Upload debug response on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: debug-response
        path: debug_response.json
        if-no-files-found: ignore

    - name: Configure Git
      run: |
        git config --global user.name 'GitHub Actions Bot'
        git config --global user.email 'actions@github.com'

    - name: Commit and push changes
      run: |
        git add NammaMetro_Ridership_Dataset.csv
        # Only commit if there are changes
        git diff --quiet && git diff --staged --quiet || git commit -m "daily dataset append [Actions]"
        git push

    - name: Refresh metro-dash dataset
      if: success()
      continue-on-error: true
      run: |
        curl -s -S -f -X POST "https://namma.thecontrarian.in/api/refresh" \
          -H "X-Refresh-Secret: ${{ secrets.METRO_DASH_REFRESH_SECRET }}" \
          -m 30
